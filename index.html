{file:"prac02c_compare_astar_rbfs.py",prac:"Practical 2C",title:"Compare A* and RBFS",aim:"Compare the performance and effectiveness of both algorithms.",needs:NO,code:String.raw`import heapq
import time

${G2}

def astar(start, goal):
    expanded = 0
    pq = [(h[start], 0, start, [start])]
    while pq:
        f, g, node, path = heapq.heappop(pq)
        expanded += 1
        if node == goal:
            return path, g, expanded
        for nxt, cost in graph[node]:
            heapq.heappush(pq, (g + cost + h[nxt], g + cost, nxt, path + [nxt]))
    return None, 0, expanded

def rbfs(node, goal, cost, path, counter):
    counter[0] += 1
    if node == goal:
        return path, cost
    if not graph[node]:
        return None
    children = sorted(graph[node], key=lambda x: cost + x[1] + h[x[0]])
    for nxt, c in children:
        result = rbfs(nxt, goal, cost + c, path + [nxt], counter)
        if result:
            return result
    return None

runs = 20000

t = time.perf_counter()
for _ in range(runs):
    a_path, a_cost, a_exp = astar('S', 'G')
a_time = time.perf_counter() - t

t = time.perf_counter()
for _ in range(runs):
    counter = [0]
    r_path, r_cost = rbfs('S', 'G', 0, ['S'], counter)
r_time = time.perf_counter() - t

print("{:<8}{:<14}{:<7}{:<16}{}".format("Algo", "Path", "Cost", "Nodes expanded", "Time"))
print("{:<8}{:<14}{:<7}{:<16}{:.4f}s".format("A*", "->".join(a_path), a_cost, a_exp, a_time))
print("{:<8}{:<14}{:<7}{:<16}{:.4f}s".format("RBFS", "->".join(r_path), r_cost, counter[0], r_time))

print()
print("A* : stores all generated nodes in a priority queue, high memory O(b^d).")
print("RBFS: keeps only the current path, low memory O(bd), may revisit nodes.")
print("Both give the optimal path when the heuristic is admissible.")
`},

{file:"prac08_knn.py",prac:"Practical 8",title:"K-Nearest Neighbors (K-NN)",aim:"Classify with K-NN, predict test data, tune k, evaluate with confusion matrix, ROC and GridSearchCV (2 graphs).",needs:"Needs diabetes.csv (Pima Indians Diabetes) in the same folder. Install: pip install numpy pandas matplotlib scikit-learn",code:String.raw`import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
from sklearn.model_selection import train_test_split, GridSearchCV
from sklearn.neighbors import KNeighborsClassifier
from sklearn.metrics import (confusion_matrix, classification_report,
                             roc_curve, roc_auc_score)

plt.style.use('ggplot')
pd.set_option('display.max_columns', None)
pd.set_option('display.width', 200)

df = pd.read_csv('diabetes.csv')
print(df.head())
print("Shape:", df.shape)
print(df.dtypes)

X = df.drop('Outcome', axis=1).values
y = df['Outcome'].values

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.4, random_state=42, stratify=y)

neighbors = np.arange(1, 9)
train_accuracy = np.empty(len(neighbors))
test_accuracy = np.empty(len(neighbors))

for i, k in enumerate(neighbors):
    knn = KNeighborsClassifier(n_neighbors=k)
    knn.fit(X_train, y_train)
    train_accuracy[i] = knn.score(X_train, y_train)
    test_accuracy[i] = knn.score(X_test, y_test)

plt.figure(figsize=(7, 5))
plt.title('k-NN: Varying Number of Neighbors')
plt.plot(neighbors, test_accuracy, label='Testing Accuracy')
plt.plot(neighbors, train_accuracy, label='Training accuracy')
plt.legend()
plt.xlabel('Number of Neighbors')
plt.ylabel('Accuracy')
plt.show()

knn = KNeighborsClassifier(n_neighbors=7)
knn.fit(X_train, y_train)
y_pred = knn.predict(X_test)

print("First 15 Predicted:", y_pred[:15])
print("Test Accuracy (k=7):", knn.score(X_test, y_test))
print("Confusion Matrix:\n", confusion_matrix(y_test, y_pred))
print(classification_report(y_test, y_pred))

fpr, tpr, thresholds = roc_curve(y_test, y_pred_proba)

plt.xlabel('fpr')

plt.title('Knn(n_neighbors=7) ROC curve')
plt.show()

pd.set_option('display.max_columns', None)

data = {
    "Decision": [
        "Launch Product A", "Launch Product B", "Upgrade Product",
        "Expand Market", "Digital Marketing", "Open New Branch",
        "Online Sales", "New Technology", "Price Discount",
        "Customer Loyalty Program"
    ],
    "Success_Probability": [0.80, 0.65, 0.90, 0.70, 0.75, 0.60, 0.85, 0.78, 0.68, 0.88],
    "Failure_Probability": [0.20, 0.35, 0.10, 0.30, 0.25, 0.40, 0.15, 0.22, 0.32, 0.12],
    "Profit": [500000, 450000, 250000, 600000, 300000,
               700000, 350000, 400000, 280000, 320000],
    "Loss": [-150000, -180000, -50000, -250000, -100000,
             -300000, -80000, -120000, -90000, -70000]
}

df = pd.DataFrame(data)

df["Expected_Value"] = (
    df["Success_Probability"] * df["Profit"] +
    df["Failure_Probability"] * df["Loss"]
)

best_decision = df.loc[df["Expected_Value"].idxmax()]

print("=" * 90)

print("=" * 90)
print(df)

print("\n" + "=" * 90)
print("BEST DECISION")

{file:"ba_prac05b_expected_value.py",prac:"Practical 5B",title:"Expected value of decision alternatives",aim:"Apply expected value to evaluate decision alternatives and select the optimal one.",needs:"No dataset file needed. Takes keyboard input. Uses plain Python.",code:String.raw`n = int(input("Enter the number of decision alternatives: "))

best_ev = float('-inf')
best_choice = ""

for i in range(n):
    print("\nDecision Alternative", i + 1)
    name = input("Enter alternative name: ")

    outcomes = int(input("Enter the number of possible outcomes: "))

    ev = 0

    for j in range(outcomes):
        payoff = float(input(f"Enter payoff for outcome {j + 1}: "))
        probability = float(input(f"Enter probability for outcome {j + 1}: "))
        ev += payoff * probability

    print(f"Expected Value of {name} = {ev:.2f}")

    if ev > best_ev:
        best_ev = ev
        best_choice = name

print("\n----- Result -----")
print("Best Decision Alternative:", best_choice)
print("Maximum Expected Value:", round(best_ev, 2))

    result = ""
    for char in text:
        if char.isalpha():
            offset = ord('a') if char.islower() else ord('A')
            result += chr((ord(char) - offset + shift) % 26 + offset)
        else:
            result += char
    return result

{file:"cis_prac01b_railfence_cipher.py",prac:"Practical 1B",title:"Transposition Cipher - Rail Fence Cipher",aim:"Encrypt and decrypt messages using a classical transposition technique.",needs:"No dataset file needed. Uses plain Python.",code:String.raw`def rail_fence_encrypt(text):
    return text[::2] + text[1::2]

def rail_fence_decrypt(cipher):
    half = (len(cipher) + 1) // 2
    first, second = cipher[:half], cipher[half:]
    return ''.join(
        first[i // 2] if i % 2 == 0 else second[i // 2]
        for i in range(len(cipher))
    )

if __name__ == "__main__":
    text = input("Enter the text: ")

    encrypted = rail_fence_encrypt(text)
    print("Encrypted:", encrypted)

    decrypted = rail_fence_decrypt(encrypted)
    print("Decrypted:", decrypted)

{file:"Server.java",prac:"Practical 9B",title:"SSL/TLS practical - Server program",aim:"Server side of the client-server socket communication (save as Server.java). Run it first: java Server",needs:"Needs JDK. Start Server first in one terminal, then run java Client in another terminal and type messages. Type BYE to stop the client.",code:String.raw`import java.io.*;
import java.net.*;

public class Server {
    public static void main(String[] args) throws IOException {
        Socket socket;
        ServerSocket serversocket = new ServerSocket(8081);
        java.io.InputStreamReader insr = null;
        java.io.OutputStreamWriter oswr = null;
        java.io.BufferedReader br = null;
        java.io.BufferedWriter bw = null;

        while (true) {
            try {
                socket = serversocket.accept();
                insr = new InputStreamReader(socket.getInputStream());
                oswr = new OutputStreamWriter(socket.getOutputStream());
                br = new BufferedReader(insr);
                bw = new BufferedWriter(oswr);
                while (true) {
                    String msgfromclient = br.readLine();
                    if (msgfromclient == null) {
                        break;
                    }
                    System.out.println(msgfromclient);
                    bw.write("Message Received");
                    bw.newLine();
                    bw.flush();
                    if (msgfromclient.equalsIgnoreCase("BYE")) {
                        break;
                    }
                }
                bw.close();
            } catch (Exception e) {
                System.out.println("Error: " + e);
            }
        }
    }
}

import java.io.File;
import java.time.Duration;
import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.WebElement;
import org.openqa.selenium.firefox.FirefoxDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.WebDriverWait;

public class FacebookLoginTest {

    private static final String DRIVER_PATH = "C:\\Users\\Student\\STQA\\geckodriver.exe";
    private static final String EMAIL = "your email id";
    private static final String PASSWORD = "your password";

    public static void main(String[] args) {
        File gecko = new File(DRIVER_PATH);
        if (gecko.exists()) {
            System.setProperty("webdriver.gecko.driver", gecko.getAbsolutePath());
        }

        WebDriver driver = new FirefoxDriver();
        try {
            driver.get("https://www.facebook.com/");
            driver.manage().window().maximize();

            String actualTitle = driver.getTitle();
            if (actualTitle.contains("Facebook")) {
                System.out.println("Verification Successful - The correct title is displayed on the web page.");
            } else {
                System.out.println("Verification Failed - An incorrect title is displayed on the web page.");
            }

            WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(15));

            WebElement username = wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("email")));
            username.clear();
            username.sendKeys(EMAIL);

            WebElement password = driver.findElement(By.id("pass"));
            password.clear();
            password.sendKeys(PASSWORD);

            WebElement loginButton = driver.findElement(By.name("login"));
            loginButton.click();

            wait.until(ExpectedConditions.not(ExpectedConditions.urlToBe("https://www.facebook.com/")));

            System.out.println("Test script executed successfully");

            System.out.println("Test script finished with message: " + e.getMessage());

            driver.quit();
        }
    }
}

{file:"CrossBrowserGridTest.java",prac:"Practical 6",title:"Cross-browser testing with Selenium Grid",aim:"Run the same script on Chrome, Firefox and Edge through the Grid and compare execution time.",needs:JN+" Start the Grid first (see stqa_prac05_06_grid_commands.txt). A browser that is not installed on the node is reported and skipped.",code:String.raw`package seleniumgrid1;

import java.net.URL;

import org.openqa.selenium.WebDriver;
import org.openqa.selenium.chrome.ChromeOptions;
import org.openqa.selenium.edge.EdgeOptions;
import org.openqa.selenium.firefox.FirefoxOptions;

public class CrossBrowserGridTest {

            Capabilities capabilities;
            if (browser.equals("chrome")) {

            } else if (browser.equals("firefox")) {
                capabilities = new FirefoxOptions();
            } else {
                capabilities = new EdgeOptions();
            }

            WebDriver driver = null;
            try {
                driver = new RemoteWebDriver(new URL(HUB_URL), capabilities);

                long start = System.currentTimeMillis();
                driver.get("https://www.selenium.dev/");
                System.out.println(browser + " : " + driver.getTitle());
                long time = System.currentTimeMillis() - start;
                System.out.println("Time : " + time + " ms");
            } catch (Exception e) {
                System.out.println(browser + " : not available on the grid");
            } finally {
                if (driver != null) {
                    driver.quit();
                }
            }
        }
    }
}

                    nowChecked++;

{file:"ScreenshotLogTest.java",prac:"Practical 11B",title:"Screenshot capture and log4j logging",aim:"Capture a screenshot on test failure and generate execution logs with log4j.",needs:JN+" Add the log4j 1.2.17 JAR and create log4j.properties first. Logs go to Execution.log and the screenshot to failure.png in the project folder.",code:String.raw`package pract11;

import java.io.File;
import java.nio.file.Files;
import java.nio.file.StandardCopyOption;
import org.apache.log4j.Logger;
import org.openqa.selenium.By;
import org.openqa.selenium.OutputType;
import org.openqa.selenium.TakesScreenshot;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.firefox.FirefoxDriver;

public class ScreenshotLogTest {

    private static final Logger log = Logger.getLogger(ScreenshotLogTest.class);
    private static final String DRIVER_PATH = "C:\\Program Files\\Mozilla Firefox\\geckodriver.exe";

    public static void main(String[] args) {
        File gecko = new File(DRIVER_PATH);
        if (gecko.exists()) {
            System.setProperty("webdriver.gecko.driver", gecko.getAbsolutePath());
        }

        WebDriver d = new FirefoxDriver();
        try {
            log.info("Test started");
            d.get("https://the-internet.herokuapp.com/login");
            log.info("Website opened");

            d.findElement(By.id("username")).sendKeys("tomsmith");
            d.findElement(By.id("password")).sendKeys("SuperSecretPassword!");
            d.findElement(By.cssSelector("button[type='submit']")).click();
            log.info("Login successful");

            d.findElement(By.id("wrongElement"));
        } catch (Exception e) {
            log.error("Test failed: " + e.getMessage());
            try {
                File src = ((TakesScreenshot) d).getScreenshotAs(OutputType.FILE);
                File dest = new File("failure.png");
                Files.copy(src.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING);
                log.info("Screenshot saved: " + dest.getAbsolutePath());
            } catch (Exception ex) {
                log.error("Screenshot could not be saved: " + ex.getMessage());
            }
        } finally {
            d.quit();
            log.info("Browser closed");
            log.info("Test completed");
        }
    }
}

{file:"WebInteractionTest.java",prac:"Practical 12",title:"Web element interaction and synchronization",aim:"Handle textbox, radio button, checkbox, drop-down, alert and frame with implicit and explicit waits.",needs:JN+" The program opens its own test page, so no website or internet is needed.",code:String.raw`package pkg12;

import java.io.File;
import java.net.URLEncoder;
import java.time.Duration;
import org.openqa.selenium.Alert;
import org.openqa.selenium.By;
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.firefox.FirefoxDriver;
import org.openqa.selenium.support.ui.ExpectedConditions;
import org.openqa.selenium.support.ui.Select;
import org.openqa.selenium.support.ui.WebDriverWait;

public class WebInteractionTest {

    private static final String DRIVER_PATH = "C:\\Users\\Student\\STQA\\geckodriver.exe";

    public static void main(String[] args) throws Exception {
        File gecko = new File(DRIVER_PATH);
        if (gecko.exists()) {
            System.setProperty("webdriver.gecko.driver", gecko.getAbsolutePath());
        }

        String html = "<html><body>"
                + "<h2>Practice Form</h2>"
                + "<input id='name' type='text'><br>"
                + "<input type='radio' name='gender' id='male'> Male "
                + "<input type='radio' name='gender' id='female'> Female<br>"
                + "<input type='checkbox' id='terms'> Accept terms<br>"
                + "<select id='country'><option>India</option><option>USA</option><option>UK</option></select><br>"
                + "<button id='alertButton' onclick=\"alert('Hello from alert')\">Show Alert</button>"
                + "<button id='delayButton' onclick=\"setTimeout(function(){document.getElementById('late').style.display='block';},2000)\">Show Message</button>"
                + "<p id='late' style='display:none'>Message loaded after delay</p>"
                + "<iframe id='myFrame' srcdoc=\"<input id='frameTextbox'>\"></iframe>"
                + "</body></html>";
        String url = "data:text/html;charset=utf-8," + URLEncoder.encode(html, "UTF-8").replace("+", "%20");

        WebDriver driver = new FirefoxDriver();
        try {
            driver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));
            driver.get(url);

            WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));

            wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("name"))).sendKeys("Admin");
            driver.findElement(By.id("female")).click();
            driver.findElement(By.id("terms")).click();

            Select country = new Select(driver.findElement(By.id("country")));
            country.selectByVisibleText("India");
            System.out.println("Selected country : " + country.getFirstSelectedOption().getText());

            driver.findElement(By.id("alertButton")).click();
            Alert alert = wait.until(ExpectedConditions.alertIsPresent());
            System.out.println("Alert text : " + alert.getText());
            alert.accept();

            driver.findElement(By.id("delayButton")).click();
            String message = wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("late"))).getText();
            System.out.println("Explicit wait message : " + message);

            wait.until(ExpectedConditions.frameToBeAvailableAndSwitchToIt(By.id("myFrame")));
            driver.findElement(By.id("frameTextbox")).sendKeys("Hello Frame");
            driver.switchTo().defaultContent();

            System.out.println("All interactions completed successfully");
        } finally {
            driver.quit();
        }
    }
}

{file:"ExcelReader.java",prac:"Practical 13",title:"Data extraction from an Excel (.xls) file with JXL",aim:"Read student marks from a worksheet and count the students who scored more than 60 in one or more subjects.",needs:"Needs JDK, Eclipse and the jxl JAR (jxl-2.6.12.jar) added to the Build Path. If student.xls is missing, the program creates a sample file in the project folder (columns: Name, Maths, Science, English).",code:String.raw`package excelread;

import java.io.File;
import java.io.IOException;
import jxl.Cell;
import jxl.CellType;
import jxl.JXLException;
import jxl.NumberCell;
import jxl.Sheet;
import jxl.Workbook;
import jxl.read.biff.BiffException;
import jxl.write.Label;
import jxl.write.WritableSheet;
import jxl.write.WritableWorkbook;

public class ExcelReader {

    private String inputFile;

    public void setInputFile(String inputFile) {
        this.inputFile = inputFile;
    }

    public void createSampleFile() throws IOException, JXLException {
        File file = new File(inputFile);
        if (file.exists()) {
            return;
        }

        WritableWorkbook workbook = Workbook.createWorkbook(file);
        WritableSheet sheet = workbook.createSheet("Marks", 0);

        String[] header = {"Name", "Maths", "Science", "English"};
        for (int c = 0; c < header.length; c++) {
            sheet.addCell(new Label(c, 0, header[c]));
        }

        String[] names = {"Amit", "Sara", "John", "Priya", "Ravi"};
        int[][] marks = {
            {75, 55, 40},
            {45, 50, 52},
            {35, 61, 48},
            {90, 85, 70},
            {30, 40, 55}
        };

        for (int r = 0; r < names.length; r++) {
            sheet.addCell(new Label(0, r + 1, names[r]));
            for (int c = 0; c < marks[r].length; c++) {
                sheet.addCell(new jxl.write.Number(c + 1, r + 1, marks[r][c]));
            }
        }

        workbook.write();
        workbook.close();
    }

    public void read() throws IOException {
        Workbook workbook = null;
        int count = 0;
        try {
            workbook = Workbook.getWorkbook(new File(inputFile));
            Sheet sheet = workbook.getSheet(0);

            for (int row = 1; row < sheet.getRows(); row++) {
                for (int col = 1; col < sheet.getColumns(); col++) {
                    Cell cell = sheet.getCell(col, row);
                    if (cell.getType() == CellType.NUMBER) {
                        double marks = ((NumberCell) cell).getValue();
                        if (marks > 60) {
                            count++;
                            break;
                        }
                    }
                }
            }

            System.out.println("Total number of students who scored more than 60 in one or more subjects: " + count);
        } catch (BiffException e) {
            e.printStackTrace();
        } finally {
            if (workbook != null) {
                workbook.close();
            }
        }
    }

    public static void main(String[] args) throws IOException, JXLException {
        ExcelReader test = new ExcelReader();
        test.setInputFile("student.xls");
        test.createSampleFile();
        test.read();
    }
}

{file:"stqa_prac14_jmeter_steps.txt",prac:"Practical 14",title:"Load testing using Apache JMeter (steps)",aim:"Design and run a load test: thread group, ramp-up time, loop count; view results.",needs:"No code. Needs JDK and Apache JMeter.",code:String.raw`Pre-requisites
1. Download the JDK (journal: jdk-19.0.2_windows-x64_bin.exe) from the official website and install it.
2. Download Apache JMeter:
   - Open https://jmeter.apache.org/download_jmeter.cgi
   - Under Apache JMeter 5.5.1 (requires Java 8+), in the Binaries sub-section, download apache-jmeter-5.5.1.zip
3. Installation: extract the zip file. Go to apache-jmeter-5.5.1 > bin. ApacheJMeter.jar in this folder is your working file.

Steps
1. Open ApacheJMeter.jar and name your Test Plan.
2. Save the test plan. It is saved with the .jmx extension.
3. Create a Thread Group: right-click the Test Plan > Add > Threads (Users) > Thread Group. Name it myThread1.
4. Under the thread group add a sampler: right-click myThread1 > Add > Sampler > HTTP Request.
5. Visit any web page that has a path. Example: lifecharger.org/when-in-doubt-do-this/
   In the HTTP Request set:
   Server Name or IP : lifecharger.org
   Path              : /when-in-doubt-do-this/
6. Under the HTTP Request sampler add 2 listeners:
   - Right-click HTTP Request > Add > Listener > View Results Tree
   - Right-click HTTP Request > Add > Listener > View Results in Table
7. Save and run the file and wait for a while. You will see some outputs.
8. Now change some Thread Group properties: Number of Threads (users) = 10, Ramp-up period = 20, Loop Count = Forever.
9. Save and run the file again and wait for a while. You will see continuous outputs. Click the Stop button to end the test.
10. Finish.
`},

const SUBJECTS = [
  {name:"Artificial Intelligence", items:AI},
  {name:"Business Analytics (EDA)", items:EDA},
  {name:"Cyber & Information Security (CIS)", items:CIS},
  {name:"Software Testing & QA (STQA)", items:STQA}
];
let P = AI;

const list = document.getElementById('list'), view = document.getElementById('view'), q = document.getElementById('q');
let cur = 0;
let DL = null;
function showDownload(){ return (typeof window.claude === 'undefined') || !!DL; }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderList(){
  const t = q.value.trim().toLowerCase();
  list.innerHTML = '';
  P.forEach((p,i)=>{
    if (t && !(p.file+p.title+p.prac).toLowerCase().includes(t)) return;
    const b = document.createElement('button');
    b.className = 'item' + (i===cur ? ' on' : '');
    b.innerHTML = '<b>' + esc(p.prac) + '</b> - ' + esc(p.title) + '<small>' + esc(p.file) + '</small>';
    b.onclick = ()=>{cur = i; renderList(); renderView(); window.scrollTo(0,0);};
    list.appendChild(b);
  });
}

function renderView(){
  const p = P[cur];
  let body = '<pre><code>' + esc(p.code) + '</code></pre>';
  if (p.data) {
    const rows = p.code.trim().split('\n').map(l => l.split(','));
    const head = rows[0];
    let t = '<p class="meta"><b>' + (rows.length - 1) + ' rows x ' + head.length + ' columns</b></p><div class="tbl"><table><thead><tr><th>#</th>';
    head.forEach(c => { t += '<th>' + esc(c) + '</th>'; });
    t += '</tr></thead><tbody>';
    for (let r = 1; r < rows.length; r++) {
      t += '<tr><td>' + r + '</td>';
      rows[r].forEach(c => { t += '<td>' + esc(c) + '</td>'; });
      t += '</tr>';
    }
    body = t + '</tbody></table></div>';
  }
  view.innerHTML =
    '<h2>' + esc(p.prac) + ': ' + esc(p.title) + '</h2>' +
    '<p class="meta">Aim: ' + esc(p.aim) + '</p>' +
    '<p class="meta">File name: <span class="fn">' + esc(p.file) + '</span></p>' +
    '<p class="meta">' + esc(p.needs) + '</p>' +
    '<div class="bar"><button class="act" id="cp">Copy code</button>' +
    (showDownload() ? '<button class="act alt" id="dl">Download file</button>' : '') + '</div>' +
    body;
  document.getElementById('cp').onclick = async (e)=>{
    try { await navigator.clipboard.writeText(p.code); }
    catch(_) {
      const ta = document.createElement('textarea'); ta.value = p.code; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    e.target.textContent = 'Copied!'; setTimeout(()=>e.target.textContent='Copy code', 1500);
  };
  const dlb = document.getElementById('dl');
  if (dlb) dlb.onclick = async (e)=>{
    const btn = e.target;
    if (DL) {
      const okExt = /\.(txt|json|md|csv|html|svg|pdf|zip)$/i.test(p.file);
      const name = okExt ? p.file : p.file + '.txt';
      try {
        await DL.save({filename: name, data: p.code});
        btn.textContent = okExt ? 'Saved' : 'Saved as .txt - remove the .txt';
      } catch (err) {
        if (!err || err.code !== 'declined') btn.textContent = 'Download unavailable';
      }
      setTimeout(()=>{ btn.textContent = 'Download file'; }, 2500);
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([p.code], {type:p.data?'text/csv':'text/plain'}));
    a.download = p.file; document.body.appendChild(a); a.click(); a.remove();
  };
}

const subj = document.getElementById('subj');
SUBJECTS.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name+' ('+x.items.length+' files)';subj.appendChild(o);});
subj.onchange = ()=>{P = SUBJECTS[subj.value].items; cur = 0; q.value = ''; renderList(); renderView();};
q.addEventListener('input', renderList);
renderList(); renderView();
(async ()=>{
  try { if (window.claude && window.claude.use) { DL = await window.claude.use('downloads'); } } catch (_) { DL = null; }
  renderView();
})();
</script>
</body>
